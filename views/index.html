<div id="footer"></div>
<script src="/js/app.js"></script>
<script>
let POSTS = [];
function renderPosts() {
  const box = document.getElementById('posts');
  box.innerHTML = POSTS.length ? POSTS.slice(0, 3).map(postCard).join('') : `<p class="empty">${esc(t('no_posts'))}</p>`;
}
function onLangChange() { renderPosts(); }
initPage('home');
api('/api/posts?limit=3').then((p) => { POSTS = p; renderPosts(); }).catch(renderPosts);
</script>
